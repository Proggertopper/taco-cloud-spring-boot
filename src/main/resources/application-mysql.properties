spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tacocloud?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tacocloud}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tacocloud}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.h2.console.enabled=false
spring.kafka.listener.auto-startup=${KAFKA_LISTENER_AUTO_STARTUP:true}
tacocloud.messaging.enabled=${TACOCLOUD_MESSAGING_ENABLED:true}
