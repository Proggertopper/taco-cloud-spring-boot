<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order | Taco Cloud</title>
    <link rel="stylesheet" th:href="@{/styles.css}" />
</head>
<body>
<main class="app-shell">
    <header class="topbar">
        <a class="brand" th:href="@{/}">
            <img th:src="@{/images/TacoCloud2.png}" alt="Taco Cloud logo" />
            <span>Taco Cloud</span>
        </a>
        <nav class="nav">
            <a class="button secondary" th:href="@{/design}">Design another taco</a>
        </nav>
    </header>

    <section class="panel">
        <form method="POST" th:action="@{/orders}" th:object="${tacoOrder}">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
            <h1>Order your taco creations</h1>

            <h3>Your tacos</h3>
            <ul>
                <li th:each="taco : ${tacoOrder.tacos}">
                    <span th:text="${taco.name}">taco name</span>
                    <span class="price" th:text="${'$' + taco.price}">$0.00</span>
                </li>
            </ul>
            <p class="total">Order total: <span th:text="${'$' + tacoOrder.total}">$0.00</span></p>
            <p class="field-error" th:if="${#fields.hasErrors('tacos')}" th:errors="*{tacos}">Order error</p>

            <div class="form-stack">
                <h3>Delivery</h3>
                <label class="form-row"><span>Name</span><input type="text" th:field="*{deliveryName}" /><span class="field-error" th:if="${#fields.hasErrors('deliveryName')}" th:errors="*{deliveryName}">Name error</span></label>
                <label class="form-row"><span>Street address</span><input type="text" th:field="*{deliveryStreet}" /><span class="field-error" th:if="${#fields.hasErrors('deliveryStreet')}" th:errors="*{deliveryStreet}">Street error</span></label>
                <label class="form-row"><span>City</span><input type="text" th:field="*{deliveryCity}" /><span class="field-error" th:if="${#fields.hasErrors('deliveryCity')}" th:errors="*{deliveryCity}">City error</span></label>
                <label class="form-row"><span>State</span><input type="text" th:field="*{deliveryState}" /><span class="field-error" th:if="${#fields.hasErrors('deliveryState')}" th:errors="*{deliveryState}">State error</span></label>
                <label class="form-row"><span>ZIP code</span><input type="text" th:field="*{deliveryZip}" /><span class="field-error" th:if="${#fields.hasErrors('deliveryZip')}" th:errors="*{deliveryZip}">ZIP error</span></label>

                <h3>Payment</h3>
                <label class="form-row">
                    <span>Credit card number</span>
                    <input type="text" th:field="*{ccNumber}" />
                    <span class="validationError" th:if="${#fields.hasErrors('ccNumber')}" th:errors="*{ccNumber}">Card error</span>
                </label>
                <label class="form-row">
                    <span>Expiration</span>
                    <input type="text" th:field="*{ccExpiration}" />
                    <span class="validationError" th:if="${#fields.hasErrors('ccExpiration')}" th:errors="*{ccExpiration}">Expiration error</span>
                </label>
                <label class="form-row">
                    <span>CVV</span>
                    <input type="text" th:field="*{ccCVV}" />
                    <span class="validationError" th:if="${#fields.hasErrors('ccCVV')}" th:errors="*{ccCVV}">CVV error</span>
                </label>
                <input type="submit" value="Submit order" />
            </div>
        </form>
    </section>
</main>
</body>
</html>
