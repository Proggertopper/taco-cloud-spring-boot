<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Taco Cloud</title>
    <link rel="stylesheet" th:href="@{/styles.css}" />
</head>
<body>
<main class="app-shell">
    <header class="topbar">
        <a class="brand" th:href="@{/}">
            <img th:src="@{/images/TacoCloud2.png}" alt="Taco Cloud logo" />
            <span>Taco Cloud</span>
        </a>
        <nav class="nav">
            <a class="button secondary" th:href="@{/design}">Design taco</a>
            <a class="button secondary" th:href="@{/orders}">Orders</a>
            <form method="POST" th:action="@{/logout}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="submit" value="Logout" />
            </form>
        </nav>
    </header>

    <section class="panel hero">
        <div>
            <h1>Welcome to Taco Cloud</h1>
            <p class="muted">Design tacos, place orders, and review your order history.</p>
            <a class="button" th:href="@{/design}">Start designing</a>
        </div>
        <img class="logo" th:src="@{/images/TacoCloud2.png}" alt="Taco Cloud logo" />
    </section>
</main>
</body>
</html>
