<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin | Taco Cloud</title>
    <link rel="stylesheet" th:href="@{/styles.css}" />
</head>
<body>
<main class="app-shell">
    <header class="topbar">
        <a class="brand" th:href="@{/}">
            <img th:src="@{/images/TacoCloud2.png}" alt="Taco Cloud logo" />
            <span>Taco Cloud</span>
        </a>
        <nav class="nav">
            <a class="button secondary" th:href="@{/orders}">My orders</a>
            <a class="button secondary" th:href="@{/design}">Design taco</a>
        </nav>
    </header>

    <section class="panel">
        <h1>Admin orders</h1>
        <form class="actions" th:action="@{/admin}" method="get">
            <select name="status">
                <option value="">All statuses</option>
                <option th:each="status : ${statuses}"
                        th:value="${status}"
                        th:selected="${selectedStatus == status}"
                        th:text="${status}">NEW</option>
            </select>
            <button type="submit">Filter</button>
        </form>

        <table class="table">
            <thead>
            <tr>
                <th>Order ID</th>
                <th>User</th>
                <th>Status</th>
                <th>Total</th>
                <th>Placed at</th>
                <th>Tacos</th>
                <th>Update</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(orders)}">
                <td colspan="7">No orders match this filter.</td>
            </tr>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}">order-id</td>
                <td th:text="${order.user != null ? order.user.username : 'API'}">user</td>
                <td><span class="status" th:text="${order.status}">NEW</span></td>
                <td class="total" th:text="${'$' + order.total}">$0.00</td>
                <td th:text="${#dates.format(order.placedAt, 'dd-MM-yyyy HH:mm')}">date</td>
                <td>
                    <ul>
                        <li th:each="taco : ${order.tacos}" th:text="${taco.name + ' ($' + taco.price + ')'}">Taco</li>
                    </ul>
                </td>
                <td>
                    <form class="actions" th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <select name="status">
                            <option th:each="status : ${statuses}"
                                    th:value="${status}"
                                    th:selected="${order.status == status}"
                                    th:text="${status}">NEW</option>
                        </select>
                        <button type="submit">Save</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <form th:action="@{/admin/deleteOrders}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit">Delete all orders</button>
        </form>
    </section>
</main>
</body>
</html>
