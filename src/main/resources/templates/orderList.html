<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your Orders | Taco Cloud</title>
    <link rel="stylesheet" th:href="@{/styles.css}" />
</head>
<body>
<main class="app-shell">
    <header class="topbar">
        <a class="brand" th:href="@{/}">
            <img th:src="@{/images/TacoCloud2.png}" alt="Taco Cloud logo" />
            <span>Taco Cloud</span>
        </a>
        <nav class="nav">
            <a class="button secondary" th:href="@{/design}">Design taco</a>
        </nav>
    </header>

    <section class="panel">
        <h1>Your orders</h1>
        <table class="table">
            <thead>
            <tr>
                <th>Order ID</th>
                <th>Status</th>
                <th>Address</th>
                <th>Total</th>
                <th>Placed at</th>
                <th>Tacos</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(orders)}">
                <td colspan="7">No orders yet.</td>
            </tr>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}">order-id</td>
                <td><span class="status" th:text="${order.status}">NEW</span></td>
                <td>
                    <strong th:text="${order.deliveryName}">Customer</strong><br />
                    <span th:text="${order.deliveryStreet}">Street</span>,
                    <span th:text="${order.deliveryCity}">City</span>,
                    <span th:text="${order.deliveryState}">State</span>,
                    <span th:text="${order.deliveryZip}">ZIP</span>
                </td>
                <td class="total" th:text="${'$' + order.total}">$0.00</td>
                <td th:text="${#dates.format(order.placedAt, 'dd-MM-yyyy HH:mm')}">date</td>
                <td>
                    <ul>
                        <li th:each="taco : ${order.tacos}">
                            <strong th:text="${taco.name}">Taco</strong>
                            <span th:text="${' ($' + taco.price + ')'}">($0.00)</span>
                            <br />
                            <span th:each="ingredient, iter : ${taco.ingredients}"
                                  th:text="${ingredient.name + (iter.last ? '' : ', ')}">Ingredient</span>
                        </li>
                    </ul>
                </td>
                <td>
                    <form th:if="${order.status.name() == 'NEW'}" th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit">Cancel</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
