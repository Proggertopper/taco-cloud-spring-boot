<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login | Taco Cloud</title>
    <link rel="stylesheet" th:href="@{/styles.css}" />
</head>
<body>
<main class="app-shell">
    <header class="topbar">
        <a class="brand" th:href="@{/}">
            <img th:src="@{/images/TacoCloud2.png}" alt="Taco Cloud logo" />
            <span>Taco Cloud</span>
        </a>
    </header>

    <section class="panel">
        <h1>Login</h1>
        <p class="error" th:if="${error}">Unable to login. Check your username and password.</p>
        <p class="muted">New here? <a th:href="@{/register}">Create an account</a>.</p>

        <form class="form-stack" method="POST" th:action="@{/login}" id="loginForm">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
            <label class="form-row">
                <span>Username</span>
                <input type="text" name="username" id="username" />
            </label>
            <label class="form-row">
                <span>Password</span>
                <input type="password" name="password" id="password" />
            </label>
            <input type="submit" value="Login" />
        </form>
    </section>
</main>
</body>
</html>
